<text x="540" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="60" font-weight="800" fill="#1F2A37" text-anchor="start" letter-spacing="1">DIRECTION</text><text x="540" y="706" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="60" font-weight="800" fill="#1F2A37" text-anchor="start" letter-spacing="1">GÉNÉRALE</text>
<rect x="540" y="726" width="90" height="6" fill="#2B7A9B"/>
<text x="540" y="791" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="400" fill="#5E6570" text-anchor="start" letter-spacing="0">Bureau de direction</text>
<text x="540" y="858" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1F2A37" text-anchor="start" letter-spacing="5" opacity="0.55">TESCA</text>
